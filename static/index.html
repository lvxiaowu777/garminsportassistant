<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>Garmin Coach</title>
<style>
/* ══════════════════════════════════════════════════════════════
   设计令牌 —— 与 Android ui/theme/Theme.kt 保持一致
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg:#0F172A;
  --card:#1E293B;
  --input:#334155;
  --accent:#8B5CF6;
  --accent-dim:#6D28D9;
  --success:#22C55E;
  --warning:#B45309;
  --danger:#EF4444;
  --text:#E2E8F0;
  --muted:#94A3B8;
  --border:#334155;
  --radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.5;
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:15px}
[hidden]{display:none!important}

/* ═══════════ 登录页 ═══════════ */
#authView{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;background:radial-gradient(ellipse at top,#1E293B 0%,#0F172A 60%);
}
.auth-box{width:100%;max-width:380px}
.auth-logo{font-size:44px;text-align:center;margin-bottom:8px}
.auth-title{font-size:22px;font-weight:700;text-align:center;margin:0 0 6px}
.auth-sub{font-size:13px;color:var(--muted);text-align:center;margin:0 0 28px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.3px}
.field input{
  width:100%;padding:13px 14px;border-radius:10px;
  background:var(--input);border:1px solid transparent;color:var(--text);
  outline:none;transition:border-color .15s;
}
.field input:focus{border-color:var(--accent)}
.field input::placeholder{color:#64748B}
.btn-primary{
  width:100%;padding:14px;border-radius:10px;
  background:var(--accent);color:#fff;font-weight:600;font-size:15px;
  transition:background .15s,transform .1s;
}
.btn-primary:hover{background:var(--accent-dim)}
.btn-primary:active{transform:scale(.99)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed}
.auth-switch{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
.auth-switch a{color:var(--accent);text-decoration:none;cursor:pointer}
.auth-err{
  margin-top:14px;padding:10px 12px;border-radius:8px;font-size:13px;
  background:rgba(239,68,68,.12);color:#FCA5A5;border:1px solid rgba(239,68,68,.3);
}

/* ═══════════ 顶部栏 ═══════════ */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;
  background:rgba(15,23,42,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(51,65,85,.6);
}
.topbar-left{display:flex;flex-direction:column;gap:2px}
.topbar-title{font-size:17px;font-weight:700;letter-spacing:.2px}
.topbar-meta{font-size:11px;color:var(--muted)}
.icon-btn{
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:17px;background:var(--card);border:1px solid rgba(51,65,85,.7);
  transition:background .15s;
}
.icon-btn:hover{background:var(--input)}

/* ═══════════ 主容器 ═══════════ */
#main{max-width:720px;margin:0 auto;padding:16px 14px 96px}
.tab-pane{display:none;flex-direction:column;gap:12px}
.tab-pane.active{display:flex}

/* ═══════════ 卡片 ═══════════ */
.card{
  background:var(--card);border-radius:var(--radius);
  padding:16px;border:1px solid rgba(51,65,85,.55);
}
.card-label{
  font-size:12px;color:var(--muted);letter-spacing:.5px;margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.big{font-size:28px;font-weight:700;color:var(--text);line-height:1.15}
.unit{font-size:13px;color:var(--muted);margin-left:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-line{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:13px}
.stat-line span:first-child{color:var(--muted)}
.stat-line span:last-child{font-weight:600}
.muted{color:var(--muted)}
.empty{padding:26px 12px;text-align:center;font-size:13px;color:var(--muted)}

/* 安全档位 */
.tier{border-radius:var(--radius);padding:16px;border:1px solid transparent}
.tier-REST    {background:#7F1D1D;color:#FCA5A5}
.tier-EASY    {background:#78350F;color:#FCD34D}
.tier-MODERATE{background:#1E3A5F;color:#93C5FD}
.tier-HARD    {background:#14532D;color:#86EFAC}
.tier-LONG    {background:#4C1D95;color:#C4B5FD}
.tier-name{font-size:24px;font-weight:800;letter-spacing:.5px}
.tier-desc{font-size:13px;opacity:.85;margin-top:2px}
.tier-list{margin:10px 0 0;padding-left:0;list-style:none;font-size:12.5px;line-height:1.7}
.tier-list li::before{content:"·";margin-right:6px;opacity:.6}

/* 天气 */
.weather-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.weather-temp{font-size:34px;font-weight:700;line-height:1}
.weather-desc{font-size:13px;color:var(--muted);margin-top:4px}
.weather-grid{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.weather-grid b{color:var(--text);font-weight:600}

/* 趋势图 */
.chart-wrap{position:relative;height:170px;margin-top:4px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

/* ═══════════ 对话 ═══════════ */
.chat-day{text-align:center;font-size:12px;color:var(--muted);margin:6px 0}
.msg{display:flex;margin-bottom:12px;gap:8px;align-items:flex-end}
.msg.user{justify-content:flex-end}
.bubble{
  max-width:82%;padding:11px 14px;border-radius:14px;font-size:14.5px;
  white-space:pre-wrap;word-break:break-word;
}
.msg.assistant .bubble{
  background:var(--card);border:1px solid rgba(51,65,85,.6);
  border-bottom-left-radius:4px;
}
.msg.user .bubble{
  background:var(--accent-dim);color:#fff;border-bottom-right-radius:4px;
}
.bubble.error{
  background:transparent;border:1px dashed rgba(148,163,184,.5);
  color:var(--muted);font-size:12.5px;
}
.tool-steps{font-size:12px;color:var(--muted);margin-bottom:8px;padding-bottom:6px;
  border-bottom:1px solid rgba(148,163,184,.15)}
.tool-line{display:flex;gap:10px;align-items:center;justify-content:space-between}
.tool-now{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-toggle{background:none;border:0;color:var(--accent);font-size:11.5px;
  cursor:pointer;padding:0;flex-shrink:0}
.tool-list{display:none;margin-top:6px}
.tool-list.open{display:block}
.tool-item{padding:2px 0;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool-item .st{display:inline-block;width:14px}
.tool-item.running .st::before{content:'◌';color:var(--accent)}
.tool-item.done .st::before{content:'✓';color:#4ADE80}
.tool-item.error .st::before{content:'✕';color:#F87171}
.msg-avatar{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  background:var(--card);border:1px solid rgba(51,65,85,.6);
}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.quick-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.quick-row::-webkit-scrollbar{display:none}
.quick{
  flex-shrink:0;padding:8px 14px;border-radius:999px;font-size:13px;
  background:var(--card);border:1px solid rgba(51,65,85,.7);color:var(--text);
  transition:border-color .15s,background .15s;
}
.quick:hover{border-color:var(--accent);background:var(--input)}
.chat-input-bar{
  position:sticky;bottom:64px;background:var(--bg);
  padding:8px 0 4px;display:flex;gap:8px;align-items:flex-end;
}
.chat-input-bar textarea{
  flex:1;resize:none;max-height:120px;padding:12px 14px;border-radius:12px;
  background:var(--input);border:1px solid transparent;color:var(--text);
  outline:none;line-height:1.45;
}
.chat-input-bar textarea:focus{border-color:var(--accent)}
.send-btn{
  width:44px;height:44px;border-radius:12px;background:var(--accent);
  color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .15s;
}
.send-btn:hover{background:var(--accent-dim)}
.send-btn:disabled{opacity:.5;cursor:not-allowed}

.train-timer{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;margin:0 0 6px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);font-size:13px;
}
.train-timer .tt-time{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
.train-timer button{
  border:0;background:none;font-size:13px;font-weight:600;cursor:pointer;padding:4px 8px;
}
.msg-hint{align-self:center;max-width:88%;text-align:center;font-size:12px;
  color:var(--muted);background:var(--card);border:1px dashed var(--line);
  border-radius:10px;padding:6px 10px;margin:6px auto;}

/* ═══════════ 训练记录 ═══════════ */
.act{display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .15s,transform .1s}
.act:hover{border-color:rgba(139,92,246,.5)}
.act:active{transform:scale(.995)}
.act-icon{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--input);
}
.act-body{flex:1;min-width:0}
.act-title{font-size:14.5px;font-weight:600;margin-bottom:3px}
.act-meta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.act-arrow{color:var(--muted);font-size:16px;flex-shrink:0}

/* 弹窗 */
.modal{
  position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(2,6,23,.72);backdrop-filter:blur(4px);padding:0;
}
@media(min-width:640px){.modal{align-items:center;padding:24px}}
.modal-box{
  width:100%;max-width:520px;max-height:86vh;overflow:auto;
  background:var(--card);border-radius:18px 18px 0 0;
  border:1px solid rgba(51,65,85,.7);
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));
}
@media(min-width:640px){.modal-box{border-radius:16px}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px}
.modal-title{font-size:17px;font-weight:700}
.modal-close{font-size:20px;color:var(--muted);line-height:1;padding:2px 6px}
.section-title{font-size:13px;font-weight:700;margin:18px 0 8px;color:var(--text)}
.split-list{display:flex;flex-wrap:wrap;gap:6px}
.split{
  font-size:12px;padding:5px 9px;border-radius:7px;
  background:var(--input);color:var(--text);font-variant-numeric:tabular-nums;
}

/* ═══════════ 底部导航 ═══════════ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;background:rgba(30,41,59,.94);backdrop-filter:blur(14px);
  border-top:1px solid rgba(51,65,85,.7);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1;padding:10px 0 11px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;color:var(--muted);transition:color .15s;
}
.tabbar button .ico{font-size:19px;line-height:1}
.tabbar button.active{color:var(--accent)}

/* 骨架屏 */
.skeleton{
  background:linear-gradient(90deg,#1E293B 25%,#273449 37%,#1E293B 63%);
  background-size:400% 100%;animation:shimmer 1.4s infinite;border-radius:8px;
}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* toast */
#toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(12px);
  background:var(--input);color:var(--text);padding:10px 18px;border-radius:10px;
  font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;
  border:1px solid rgba(51,65,85,.8);max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═══════════ 我的 / 设置 ═══════════ */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .field{margin-bottom:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{
  padding:8px 14px;border-radius:999px;font-size:13px;
  background:var(--input);border:1px solid transparent;transition:border-color .15s;
}
.chip.active{border-color:var(--accent);color:#C4B5FD}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(51,65,85,.5)}
.list-item:last-child{border-bottom:none}
.li-main{flex:1;min-width:0}
.li-title{font-size:14.5px;font-weight:600}
.li-sub{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-all}
.btn-ghost{padding:9px 14px;border-radius:10px;background:var(--input);font-size:13.5px}
.btn-danger{background:rgba(239,68,68,.15);color:#FCA5A5}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px;background:var(--input);flex-shrink:0}

/* ═══════════ 语音 ═══════════ */
.mic-btn{
  width:44px;height:44px;border-radius:12px;background:var(--input);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
  transition:background .15s,transform .1s;
}
.mic-btn.recording{background:var(--danger);color:#fff;transform:scale(.96)}
.rec-banner{
  position:fixed;left:50%;bottom:130px;transform:translateX(-50%);
  background:rgba(239,68,68,.94);color:#fff;padding:9px 18px;border-radius:999px;
  font-size:13px;z-index:70;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.rec-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.msg-col{display:flex;flex-direction:column;max-width:82%}
.msg.user .msg-col{align-items:flex-end}
.msg-time{font-size:10.5px;color:var(--muted);margin-top:4px;padding:0 4px}
.audio-row{display:flex;align-items:center;gap:8px;min-width:130px}
.audio-play{
  width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;
}
.audio-bars{flex:1;display:flex;align-items:center;gap:2px;height:18px}
.audio-bars i{width:3px;border-radius:2px;background:currentColor;opacity:.65}
.audio-extra{font-size:11px;opacity:.75;flex-shrink:0}

</style>
</head>
<body>

<!-- ═══════════ 登录 ═══════════ -->
<div id="authView">
  <div class="auth-box">
    <div class="auth-logo">🏃</div>
    <h1 class="auth-title">Garmin Coach</h1>
    <p class="auth-sub">运动数据 + AI 教练</p>
    <form id="authForm">
      <div class="field">
        <label for="authPhone">手机号</label>
        <input id="authPhone" type="tel" inputmode="numeric" placeholder="请输入手机号" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="authPassword">密码</label>
        <input id="authPassword" type="password" placeholder="请输入密码" autocomplete="current-password" required>
      </div>
      <button class="btn-primary" id="authSubmit" type="submit">登录</button>
    </form>
    <div class="auth-switch">
      <span id="authSwitchText">还没有账号？</span>
      <a id="authSwitch">注册</a>
    </div>
    <div class="auth-err" id="authErr" hidden></div>
  </div>
</div>

<!-- ═══════════ 主界面 ═══════════ -->
<div id="appView" hidden>
  <header class="topbar">
    <div class="topbar-left">
      <div class="topbar-title">Garmin Coach</div>
      <div class="topbar-meta" id="topbarMeta">加载中…</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="refreshBtn" title="刷新">⟳</button>
      <button class="icon-btn" id="logoutBtn" title="退出">⎋</button>
    </div>
  </header>

  <main id="main">
    <section class="tab-pane active" data-pane="dashboard">
      <div id="dashContent"></div>
    </section>

    <section class="tab-pane" data-pane="chat">
      <div id="chatList"></div>
      <div class="quick-row" id="quickRow"></div>
      <div class="train-timer" id="trainTimer">
        <span id="ttLabel">🏋️ 力量训练计时</span>
        <span class="tt-time" id="ttTime" hidden>00:00</span>
        <button id="ttBtn" style="color:var(--accent)">开始</button>
      </div>
      <div class="chat-input-bar">
        <button class="mic-btn" id="micBtn" title="按住说话">🎤</button>
        <textarea id="chatInput" rows="1" placeholder="问运动助理…"></textarea>
        <button class="send-btn" id="sendBtn" title="发送">↑</button>
      </div>
    </section>

    <section class="tab-pane" data-pane="history">
      <div id="historyContent"></div>
    </section>

    <section class="tab-pane" data-pane="me">
      <div id="meContent"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-tab="dashboard" class="active"><span class="ico">📊</span>仪表盘</button>
    <button data-tab="chat"><span class="ico">💬</span>对话</button>
    <button data-tab="history"><span class="ico">📋</span>记录</button>
    <button data-tab="me"><span class="ico">👤</span>我的</button>
  </nav>
</div>

<div class="rec-banner" id="recBanner" hidden><span class="rec-dot"></span><span id="recText">正在录音… 松开发送</span></div>

<!-- 弹窗 -->
<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   1. 基础设施
   ══════════════════════════════════════════════════════════════ */
const API_BASE = '';
const LS_TOKEN = 'gc_token';
const LS_USER = 'gc_user_id';

const state = {
  token: localStorage.getItem(LS_TOKEN) || '',
  userId: Number(localStorage.getItem(LS_USER) || 0),
  isRegister: false,
  chatBusy: false,
  chatMessages: [],
  chart: null,
  // 我的：档案 + 手表绑定
  profile: null,
  bindings: [],
  meLoaded: false,
};

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function toast(msg, ms = 2000) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), ms);
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/** 统一请求：自动带 token，401 时回登录页 */
async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  // FormData（语音上传）不能设 Content-Type，否则 boundary 会丢
  if (opts.body && typeof opts.body !== 'string' && !(opts.body instanceof FormData)) {
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  if (state.token) headers['Authorization'] = `Bearer ${state.token}`;

  const res = await fetch(API_BASE + path, { ...opts, headers });
  // 注意：登录/注册接口的 401 表示「账号或密码不对」，不是 token 失效。
  // 必须把 /api/auth/ 排除掉，否则用户输错密码会看到「登录已失效」这种
  // 毫无帮助的提示，真正的错误原因（后端 detail 里的"密码错误"）被吞掉。
  if (res.status === 401 && !path.startsWith('/api/auth/')) {
    logout();
    throw new Error('登录已失效，请重新登录');
  }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) {
    const detail = (data && data.detail) || (typeof data === 'string' ? data : '') || `请求失败 (${res.status})`;
    throw new Error(detail);
  }
  return data;
}

/* ══════════════════════════════════════════════════════════════
   2. 登录 / 退出
   ══════════════════════════════════════════════════════════════ */
function showAuthError(msg) {
  const box = $('#authErr');
  box.textContent = msg;
  box.hidden = false;
}

function switchAuthMode() {
  state.isRegister = !state.isRegister;
  $('#authSubmit').textContent = state.isRegister ? '注册' : '登录';
  $('#authSwitchText').textContent = state.isRegister ? '已有账号？' : '还没有账号？';
  $('#authSwitch').textContent = state.isRegister ? '登录' : '注册';
  $('#authErr').hidden = true;
  $('#authPassword').setAttribute('autocomplete', state.isRegister ? 'new-password' : 'current-password');
}

$('#authSwitch').addEventListener('click', switchAuthMode);

$('#authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const phone = $('#authPhone').value.trim();
  const password = $('#authPassword').value;
  const btn = $('#authSubmit');
  $('#authErr').hidden = true;

  if (!phone || !password) return showAuthError('请填写手机号和密码');
  btn.disabled = true;
  btn.textContent = state.isRegister ? '注册中…' : '登录中…';

  try {
    const path = state.isRegister ? '/api/auth/register' : '/api/auth/login';
    const data = await api(path, { method: 'POST', body: { phone, password } });
    if (!data || !data.token) throw new Error('服务端未返回 token');
    state.token = data.token;
    state.userId = data.user_id;
    localStorage.setItem(LS_TOKEN, data.token);
    localStorage.setItem(LS_USER, String(data.user_id));
    enterApp();
  } catch (err) {
    showAuthError(err.message || '操作失败');
  } finally {
    btn.disabled = false;
    btn.textContent = state.isRegister ? '注册' : '登录';
  }
});

function logout() {
  state.token = '';
  state.userId = 0;
  localStorage.removeItem(LS_TOKEN);
  localStorage.removeItem(LS_USER);
  state.chatMessages = [];
  state.profile = null;
  state.bindings = [];
  state.meLoaded = false;
  $('#appView').hidden = true;
  $('#authView').hidden = false;
  $('#authPassword').value = '';
}

$('#logoutBtn').addEventListener('click', () => {
  logout();
  toast('已退出登录');
});

function enterApp() {
  $('#authView').hidden = true;
  $('#appView').hidden = false;
  loadDashboard();
}

const TIER_CLASS = { REST:'tier-REST', EASY:'tier-EASY', MODERATE:'tier-MODERATE', HARD:'tier-HARD', LONG:'tier-LONG' };
const TIER_LABEL = { REST:'休息', EASY:'轻松跑', MODERATE:'有氧稳态', HARD:'高强度', LONG:'长距离' };

function hrvStatusLabel(s) {
  const m = { BALANCED:'均衡', UNBALANCED:'失衡', LOW:'偏低', POOR:'偏差', HIGH:'偏高' };
  return m[String(s || '').toUpperCase()] || (s || '');
}

function weatherIcon(desc) {
  const d = String(desc || '');
  if (/雷/.test(d)) return '⛈️';
  if (/暴雨|大雨/.test(d)) return '🌧️';
  if (/雨/.test(d)) return '🌦️';
  if (/雪/.test(d)) return '🌨️';
  if (/雾|霾/.test(d)) return '🌫️';
  if (/阴/.test(d)) return '☁️';
  if (/多云/.test(d)) return '⛅';
  if (/晴/.test(d)) return '☀️';
  return '🌤️';
}

function activityIcon(type) {
  const m = { running:'🏃', cycling:'🚴', swimming:'🏊', strength_training:'🏋️', walking:'🚶' };
  return m[type] || '🏅';
}

function activityLabel(type) {
  const m = { running:'跑步', cycling:'骑行', swimming:'游泳', strength_training:'力量训练', walking:'步行' };
  return m[type] || (type || '运动');
}

/**
 * 7 天趋势图 —— 用原生 Canvas 手绘，不依赖任何图表库。
 *
 * 之前引了 Chart.js 的 CDN，结果 jsdelivr 在国内连不上，
 * 页面会一直卡在等脚本，趋势图也出不来。Android 端本来就是
 * Canvas 手绘（DashboardScreen 的 ChartCard），这里保持一致，
 * 顺便换来零外部依赖。
 */
function drawTrend(charts) {
  const canvas = $('#trendChart');
  if (!canvas) return;

  const hrv = charts.hrv_trend || [];
  const rhr = charts.rhr_trend || [];
  const base = hrv.length ? hrv : rhr;
  const labels = base.map(p => (p.date || '').slice(5));

  if (!labels.length) {
    canvas.parentElement.innerHTML = '<div class="empty">暂无趋势数据</div>';
    return;
  }

  // 高清屏适配：按 devicePixelRatio 放大后备缓冲，再用 CSS 缩回原尺寸
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.parentElement.clientWidth || 320;
  const cssH = canvas.parentElement.clientHeight || 170;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const padL = 32, padR = 8, padT = 10, padB = 20;
  const W = Math.max(10, cssW - padL - padR);
  const H = Math.max(10, cssH - padT - padB);

  const pick = (arr, i) => {
    const hit = arr.find(p => (p.date || '').slice(5) === labels[i]);
    return hit && hit.value != null ? hit.value : null;
  };
  const series = [
    { color: '#8B5CF6', vals: labels.map((_, i) => pick(hrv, i)) },
    { color: '#22C55E', vals: labels.map((_, i) => pick(rhr, i)) },
  ];

  const all = series.flatMap(s => s.vals).filter(v => v != null);
  if (!all.length) {
    canvas.parentElement.innerHTML = '<div class="empty">暂无趋势数据</div>';
    return;
  }
  const min = Math.min(...all);
  const max = Math.max(...all);
  const span = (max - min) || 1;

  const px = i => labels.length === 1 ? padL + W / 2 : padL + (i / (labels.length - 1)) * W;
  const py = v => padT + H - ((v - min) / span) * H;

  // 横向网格 + Y 轴刻度
  ctx.font = '10px -apple-system, "Segoe UI", sans-serif';
  ctx.textBaseline = 'middle';
  for (let g = 0; g <= 3; g++) {
    const gy = padT + (H / 3) * g;
    ctx.strokeStyle = 'rgba(51,65,85,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, gy);
    ctx.lineTo(padL + W, gy);
    ctx.stroke();
    ctx.fillStyle = '#94A3B8';
    ctx.textAlign = 'right';
    ctx.fillText(String(Math.round(max - (span / 3) * g)), padL - 5, gy);
  }

  // X 轴日期（最多 5 个，避免挤在一起）
  ctx.textAlign = 'center';
  ctx.fillStyle = '#94A3B8';
  const step = Math.max(1, Math.ceil(labels.length / 5));
  labels.forEach((d, i) => {
    if (i % step !== 0 && i !== labels.length - 1) return;
    ctx.fillText(d, px(i), cssH - 8);
  });

  // 折线与数据点（遇到 null 就断开，不连到下一个有效点）
  series.forEach(s => {
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    let drawing = false;
    s.vals.forEach((v, i) => {
      if (v == null) { drawing = false; return; }
      const x = px(i), y = py(v);
      if (!drawing) { ctx.moveTo(x, y); drawing = true; }
      else ctx.lineTo(x, y);
    });
    ctx.stroke();

    ctx.fillStyle = s.color;
    s.vals.forEach((v, i) => {
      if (v == null) return;
      ctx.beginPath();
      ctx.arc(px(i), py(v), 2.2, 0, Math.PI * 2);
      ctx.fill();
    });
  });
}

const QUICK_QUESTIONS = ['今晚跑不跑？', '我最近状态怎么样', '这周跑量多少', '帮我安排明天训练'];

function renderQuickRow() {
  $('#quickRow').innerHTML = QUICK_QUESTIONS
    .map(q => `<button class="quick" data-q="${esc(q)}">${esc(q)}</button>`).join('');
  $$('#quickRow .quick').forEach(btn => {
    btn.addEventListener('click', () => {
      $('#chatInput').value = btn.dataset.q;
      sendChat();
    });
  });
}

function fmtTime(ts) {
  if (!ts) return '';
  const m = String(ts).match(/(\d{2}):(\d{2})/);
  return m ? `${m[1]}:${m[2]}` : '';
}

/** 单条消息的 HTML（文字 / 语音） */
const TOOL_LABELS = {
  get_today: '正在获取今天的身体数据',
  get_safety: '正在评估今天的安全强度',
  get_recent: '正在拉取最近的训练记录',
  get_activity: '正在查看这次活动的详情',
  get_day: '正在查看那天的数据',
  get_weather: '正在查询天气',
  get_profile: '正在读取你的训练档案',
  record_training: '正在记录这次训练',
  save_plan: '正在保存训练计划',
  get_exercise_names: '正在核对动作名称',
};
function toolLabel(name) {
  return TOOL_LABELS[name] || '正在查询数据';
}

function stepsHtml(m, idx) {
  const steps = m.steps || [];
  if (!steps.length) return '';
  const last = steps[steps.length - 1];
  const open = !!m.expanded;
  const items = steps.map(s =>
    `<div class="tool-item ${s.status}"><span class="st"></span>${esc(toolLabel(s.name))}</div>`
  ).join('');
  return `<div class="tool-steps">
    <div class="tool-line">
      <span class="tool-now">${esc(toolLabel(last.name))}…</span>
      <button class="tool-toggle" data-idx="${idx}">${open ? '收起' : `全部 ${steps.length} 步`}</button>
    </div>
    <div class="tool-list ${open ? 'open' : ''}">${items}</div>
  </div>`;
}

function msgHtml(m, idx) {
  const isUser = m.role === 'user';
  const time = m.created_at ? `<div class="msg-time">${esc(fmtTime(m.created_at))}</div>` : '';
  let body;
  if (m.type === 'voice' && m.audio_url) {
    const bars = Array.from({ length: 7 }, (_, k) => `<i style="height:${5 + ((k * 7) % 13)}px"></i>`).join('');
    const extra = m.duration_sec ? `<span class="audio-extra">${m.duration_sec}"</span>` : '';
    const transcript = m.content ? `<div style="margin-top:6px;font-size:13px;opacity:.9">${esc(m.content)}</div>` : '';
    body = `<div class="audio-row" data-audio="${esc(m.audio_url)}">
      <span class="audio-play">▶</span><span class="audio-bars">${bars}</span>${extra}</div>${transcript}`;
  } else if (m.type === 'hint') {
    return `<div class="msg-hint">${esc(m.content || '')}</div>`;
  } else if (m.type === 'error') {
    body = `⚠️ ${esc(m.content || '回复中断')}`;
  } else {
    body = esc(m.content || '');
  }
  const bubbleClass = m.type === 'error' ? 'bubble error' : 'bubble';
  const steps = isUser ? '' : stepsHtml(m, idx);
  return `<div class="msg ${isUser ? 'user' : 'assistant'}">
    ${isUser ? '' : '<div class="msg-avatar">🤖</div>'}
    <div class="msg-col"><div class="${bubbleClass}">${steps}${body}</div>${time}</div>
  </div>`;
}

function renderChat() {
  const list = $('#chatList');
  if (!state.chatMessages.length && !state.chatBusy) {
    list.innerHTML = `<div class="empty" style="padding:40px 12px">
      💬<br>跟运动助理聊聊你的训练<br>
      <span style="font-size:12px">它会主动查你的心率、睡眠、跑量再回答</span>
    </div>`;
    return;
  }
  list.innerHTML = state.chatMessages.map((m, i) => msgHtml(m, i)).join('') + (state.chatBusy
    ? `<div class="msg assistant"><div class="msg-avatar">🤖</div><div class="msg-col"><div class="bubble typing"><i></i><i></i><i></i></div></div></div>`
    : '');
  // 语音气泡点击播放
  $$('#chatList [data-audio]').forEach(el => {
    el.addEventListener('click', () => playAudio(el.dataset.audio, el));
  });
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

let _audio = null;
function playAudio(url, rowEl) {
  if (!url) return;
  if (_audio && _audio.dataset.src === url && !_audio.paused) {
    _audio.pause();
    if (rowEl) rowEl.querySelector('.audio-play').textContent = '▶';
    return;
  }
  if (_audio) _audio.pause();
  _audio = new Audio(url);
  _audio.dataset.src = url;
  if (rowEl) rowEl.querySelector('.audio-play').textContent = '⏸';
  _audio.onended = () => { if (rowEl) rowEl.querySelector('.audio-play').textContent = '▶'; };
  _audio.play().catch(() => toast('播放失败'));
}

const trainTimer = { startedAt: 0, tick: 0 };

function startTrainTimer() {
  if (trainTimer.startedAt) return;
  trainTimer.startedAt = Date.now();
  $('#ttLabel').textContent = '⏱ 力量训练中';
  $('#ttTime').hidden = false;
  $('#ttBtn').textContent = '结束并记录';
  $('#ttBtn').style.color = '#ef4444';
  const paint = () => {
    if (!trainTimer.startedAt) return;
    const s = Math.floor((Date.now() - trainTimer.startedAt) / 1000);
    $('#ttTime').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  };
  paint();
  trainTimer.tick = setInterval(paint, 1000);
}

function stopTrainTimer() {
  if (!trainTimer.startedAt) return;
  const seconds = (Date.now() - trainTimer.startedAt) / 1000;
  trainTimer.startedAt = 0;
  clearInterval(trainTimer.tick);
  $('#ttLabel').textContent = '🏋️ 力量训练计时';
  $('#ttTime').hidden = true;
  $('#ttBtn').textContent = '开始';
  $('#ttBtn').style.color = 'var(--accent)';

  const minutes = Math.max(1, Math.ceil(seconds / 60));
  state.pendingTrainingMinutes = minutes;
  state.chatMessages.push({
    role: 'assistant',
    type: 'hint',
    content: `已计时 ${minutes} 分钟。刚练了什么？直接打字或按住说话告诉我就行；不想说也可以，我先把时长记下。`,
  });
  switchTab('chat');
  renderChat();
  toast('记得拉伸一下 🧘');
  setTimeout(() => $('#chatInput')?.focus(), 200);
}

$('#ttBtn').addEventListener('click', () => {
  trainTimer.startedAt ? stopTrainTimer() : startTrainTimer();
});

async function sendChat() {
  if (state.chatBusy) return;
  const input = $('#chatInput');
  let msg = input.value.trim();
  if (!msg) return;

  // 刚结束一次力量计时：把时长带上，Agent 才知道"42 分钟"
  if (state.pendingTrainingMinutes) {
    msg = `本次力量训练 ${state.pendingTrainingMinutes} 分钟。${msg}`;
    state.pendingTrainingMinutes = 0;
  }

  input.value = '';
  input.style.height = 'auto';
  state.chatMessages.push({ role: 'user', content: msg, created_at: new Date().toISOString() });

  // 先放一个空的助手气泡，边收边填（打字机）
  const bubble = { role: 'assistant', content: '', steps: [], created_at: new Date().toISOString() };
  state.chatMessages.push(bubble);

  state.chatBusy = true;
  renderChat();

  const sendBtn = $('#sendBtn');
  sendBtn.disabled = true;

  try {
    await streamChat(msg, bubble);
  } catch (err) {
    bubble.content = (bubble.content ? bubble.content + '\n' : '') + `⚠️ ${err.message}`;
  } finally {
    state.chatBusy = false;
    sendBtn.disabled = false;
    renderChat();
  }
}

/**
 * 消费后端 SSE（Agent 层事件），边收边渲染。
 * 事件类型：text / thinking / tool_call / tool_result / done / error
 */
async function streamChat(message, bubble) {
  const res = await fetch(API_BASE + '/api/chat/stream', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      ...(state.token ? { Authorization: `Bearer ${state.token}` } : {}),
    },
    body: JSON.stringify({ message }),
  });

  if (res.status === 401) {
    logout();
    throw new Error('登录已失效，请重新登录');
  }
  if (!res.ok || !res.body) {
    const text = await res.text().catch(() => '');
    throw new Error(text || `请求失败 (${res.status})`);
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let lastPaint = 0;

  const paint = () => {
    const now = performance.now();
    if (now - lastPaint > 40) {       // 40ms 节流，避免每个 token 都重排
      lastPaint = now;
      renderChat();
    }
  };

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    let idx;
    while ((idx = buffer.indexOf('\n\n')) >= 0) {
      const frame = buffer.slice(0, idx).trim();
      buffer = buffer.slice(idx + 2);
      if (!frame.startsWith('data:')) continue;

      let evt;
      try { evt = JSON.parse(frame.slice(5).trim()); } catch { continue; }

      if (evt.type === 'text') {
        bubble.content += evt.text;
        paint();
      } else if (evt.type === 'done') {
        // 以最终结果为准（含工具执行后的完整文本）
        bubble.content = evt.reply || bubble.content;
        (bubble.steps || []).forEach(s => { if (s.status === 'running') s.status = 'done'; });
        if (Array.isArray(evt.tools) && evt.tools.includes('record_training')) {
          toast('已记录这次训练');
        }
      } else if (evt.type === 'error') {
        bubble.content += `\n⚠️ ${evt.message}`;
      } else if (evt.type === 'tool_call') {
        bubble.steps.push({ name: evt.name, call_id: evt.call_id, status: 'running' });
        paint();
      } else if (evt.type === 'tool_result') {
        const step = [...bubble.steps].reverse().find(s => s.call_id === evt.call_id);
        if (step) step.status = evt.is_error ? 'error' : 'done';
        paint();
      }
    }
  }
  renderChat();
}

function renderHistory(days) {
  const box = $('#historyContent');
  const items = [];
  for (const day of days) {
    for (const a of (day.activities || [])) items.push({ ...a, date: day.date });
  }
  items.sort((x, y) => String(y.date).localeCompare(String(x.date)));

  if (!items.length) {
    box.innerHTML = `<div class="card"><div class="empty">
      🏋️<br>暂无训练记录<br>
      <span style="font-size:12px">去对话页跟助理说「我今天练了力量」来记录</span>
    </div></div>`;
    return;
  }

  box.innerHTML = items.map(a => {
    const meta = [
      a.distance_km != null ? `${a.distance_km} km` : '',
      a.duration_min != null ? `${Math.round(a.duration_min)} 分钟` : '',
      a.avg_pace ? `配速 ${a.avg_pace}` : '',
      a.avg_hr ? `心率 ${a.avg_hr}` : '',
    ].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('');

    return `<div class="card act" data-id="${esc(a.activity_id || '')}">

function renderActivityDetail(a) {
  const rows = [];
  const add = (label, value, unit = '') => {
    if (value != null && value !== '') {
      rows.push(`<div class="stat-line"><span>${esc(label)}</span><span>${esc(value)}${unit ? ' ' + esc(unit) : ''}</span></div>`);
    }
  };

  add('日期', a.date);
  add('时间', a.time);
  add('地点', a.location);
  add('距离', a.distance_km, 'km');
  add('时长', a.duration_min, '分钟');
  add('平均配速', a.avg_pace);
  add('平均心率', a.avg_hr, 'bpm');
  add('最高心率', a.max_hr, 'bpm');
  add('卡路里', a.calories, 'kcal');
  add('有氧训练效果', a.training_effect_aerobic);
  add('步频', a.cadence_avg);
  add('爬升', a.elevation_gain_m, 'm');

  let html = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
    <div class="act-icon" style="width:52px;height:52px;font-size:24px">${activityIcon(a.type)}</div>
    <div>
      <div style="font-size:16px;font-weight:700">${esc(activityLabel(a.type))}</div>
      <div class="muted" style="font-size:12.5px">${esc(a.date || '')} ${esc(a.time || '')}</div>
    </div>
  </div>`;
  html += rows.join('');

  let zones = a.hr_zones;
  if (typeof zones === 'string') { try { zones = JSON.parse(zones); } catch { zones = null; } }
  if (zones && typeof zones === 'object') {
    const secs = Object.entries(zones).filter(([k, v]) => k.endsWith('_sec') && v);
    if (secs.length) {
      html += `<div class="section-title">心率区间</div><div class="split-list">` +
        secs.map(([k, v]) => `<span class="split">${esc(k.replace('_sec','').toUpperCase())} ${Math.round(v/60)}分</span>`).join('') +
        `</div>`;
    }
  }

  let splits = a.splits;
  if (typeof splits === 'string') { try { splits = JSON.parse(splits); } catch { splits = null; } }
  if (Array.isArray(splits) && splits.length) {
    html += `<div class="section-title">分段配速</div><div class="split-list">` +
      splits.map(s => {
        const t = [s.km != null ? s.km + 'km' : '', s.pace || '', s.hr ? 'HR' + s.hr : ''].filter(Boolean).join(' ');
        return `<span class="split">${esc(t)}</span>`;
      }).join('') + `</div>`;
  }

  if (Array.isArray(a.strength_sets) && a.strength_sets.length) {
    html += `<div class="section-title">动作明细</div>`;
    html += a.strength_sets.map(s => {
      const detail = [
        s.sets != null ? `${s.sets} 组` : '',
        s.reps_detail ? s.reps_detail : (s.reps != null ? `× ${s.reps}` : ''),
        s.weight_kg != null ? `${s.weight_kg} kg` : '',
        s.equipment || '',
      ].filter(Boolean).join(' · ');
      return `<div class="stat-line"><span>${esc(s.name || '')}</span><span>${esc(detail)}</span></div>`;
    }).join('');
  }

  $('#modalBody').innerHTML = html;

  // 记录操作：删除（都有）/ 编辑动作（仅力量训练）
  const actions = document.createElement('div');
  actions.style.cssText = 'display:flex;gap:10px;margin-top:18px';
  if (a.type === 'strength_training') {
    const editBtn = document.createElement('button');
    editBtn.className = 'btn-ghost';
    editBtn.textContent = '编辑动作';
    editBtn.addEventListener('click', () => openEditExercises(a));
    actions.appendChild(editBtn);
  }
  const delBtn = document.createElement('button');
  delBtn.className = 'btn-ghost btn-danger';
  delBtn.textContent = '删除记录';
  delBtn.addEventListener('click', () => deleteActivity(a.activity_id));
  actions.appendChild(delBtn);
  $('#modalBody').appendChild(actions);
}

    <div class="field"><label>重量 kg</label><input data-k="weight_kg" type="number" step="0.5" value="${s.weight_kg != null ? s.weight_kg : ''}"></div>
  </div>`;
  openModal('编辑动作明细',
    `<div id="exRows">${(sets.length ? sets : [{}]).map(rowHtml).join('')}</div>
     <button class="btn-ghost" id="exAdd" style="width:100%;margin-top:4px">+ 加一个动作</button>
     <button class="btn-primary" id="exSave" style="margin-top:12px">保存</button>`);

  $('#exAdd').addEventListener('click', () => {
    $('#exRows').insertAdjacentHTML('beforeend', rowHtml());
  });

  $('#exSave').addEventListener('click', async () => {
    const exercises = $$('#exRows [data-ex]').map(row => {
      const get = k => row.querySelector(`[data-k="${k}"]`);
      const num = v => (v === '' || v == null ? null : Number(v));
      const name = get('name').value.trim();
      if (!name) return null;
      return {
        name,
        sets: num(get('sets').value),
        reps: num(get('reps').value),
        weight_kg: num(get('weight_kg').value),
      };
    }).filter(Boolean);
    try {
      await api(`/api/health/activity/${encodeURIComponent(a.activity_id)}`, {
        method: 'PUT', body: { exercises },
      });
      closeModal();
      toast('已保存');
      loadHistory();
    } catch (err) {
      toast('保存失败：' + err.message);
    }
  });
}

      </div>
      <div class="field" style="margin-top:12px"><label>训练经验 (年)</label><input id="pfYears" type="number" step="0.5" value="${num(p.training_years)}"></div>
      <div style="margin-top:12px"><div class="card-label">性别</div><div class="chips" id="pfGender">${chipRow(GENDERS, p.gender, 'data-v')}</div></div>
      <div style="margin-top:12px"><div class="card-label">训练目标</div><div class="chips" id="pfGoal">${chipRow(GOALS, p.goal, 'data-v')}</div></div>
      <div class="field" style="margin-top:12px"><label>目标成绩（可选，如 1:45:00）</label><input id="pfGoalTarget" value="${esc(p.goal_target || '')}"></div>
      <button class="btn-primary" id="meSave" style="margin-top:6px">保存</button>
    </div>

    <div class="card">
      <div class="card-label">⌚ 手表绑定</div>
      <div id="watchList">${watchHtml}</div>
      <button class="btn-ghost" id="watchAdd" style="width:100%;margin-top:10px">+ 添加手表</button>
      <div class="muted" style="font-size:11.5px;margin-top:8px">同一时间只启用一个品牌，仪表盘按当前启用的品牌取数。</div>
    </div>`;

  // chips 单选
  const bindChips = (sel, hidden) => {
    $$(`${sel} .chip`).forEach(c => c.addEventListener('click', () => {
      $$(`${sel} .chip`).forEach(x => x.classList.remove('active'));
      c.classList.add('active');
    }));
  };
  bindChips('#pfGender');
  bindChips('#pfGoal');

  $('#meLogout').addEventListener('click', () => { logout(); toast('已退出登录'); });
  $('#meSave').addEventListener('click', saveProfile);
  $('#watchAdd').addEventListener('click', openBindModal);

  $$('#watchList [data-act]').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = btn.closest('[data-brand]');
      const brand = item.dataset.brand;
      const act = btn.dataset.act;
      if (act === 'select') selectWatch(brand);
      if (act === 'toggle') toggleWatch(brand, item.dataset.enabled !== '1');
      if (act === 'unbind') unbindWatch(brand);
    });
  });
}

function collectProfile() {
  const numOrNull = id => {
    const v = $(id).value.trim();
    return v === '' ? null : Number(v);
  };
  const chipVal = sel => {
    const el = $(`${sel} .chip.active`);
    return el ? el.dataset.v : null;
  };
  return {
    height_cm: numOrNull('#pfHeight'),
    weight_kg: numOrNull('#pfWeight'),
    age: numOrNull('#pfAge'),
    training_freq_per_week: numOrNull('#pfFreq'),
    body_fat_pct: numOrNull('#pfBodyFat'),
    muscle_mass_kg: numOrNull('#pfMuscle'),
    training_years: numOrNull('#pfYears'),
    gender: chipVal('#pfGender'),
    goal: chipVal('#pfGoal'),
    goal_target: $('#pfGoalTarget').value.trim() || null,
  };
}

async function saveProfile() {
  const btn = $('#meSave');
  btn.disabled = true;
  btn.textContent = '保存中…';
  try {
    const body = collectProfile();
    // 去掉 null，避免把已有字段清空
    Object.keys(body).forEach(k => body[k] == null && delete body[k]);
    await api('/api/user/profile', { method: 'POST', body });
    toast('已保存');
    state.meLoaded = false;
    await loadMe();
  } catch (err) {
    toast('保存失败：' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '保存';
  }
}

/* ── 手表绑定 ── */
function openBindModal() {
  openModal('添加手表', `
    <div class="field"><label>品牌</label>
      <div class="chips" id="bindBrands">${BRANDS.map(([k, l], i) => `<button class="chip${i === 0 ? ' active' : ''}" data-brand="${k}">${l}</button>`).join('')}</div>
    </div>
    <div class="field"><label>账号</label><input id="bindAccount" placeholder="佳明邮箱 / 其他品牌账号" autocomplete="username"></div>
    <div class="field"><label>密码</label><input id="bindPassword" type="password" placeholder="密码" autocomplete="current-password"></div>
    <div id="mfaBox" hidden>
      <div class="field"><label>两步验证码</label><input id="mfaCode" inputmode="numeric" placeholder="6 位验证码"></div>
      <button class="btn-primary" id="mfaSubmit">提交验证码</button>
    </div>
    <button class="btn-primary" id="bindSubmit" style="margin-top:12px">绑定</button>
    <div class="muted" style="font-size:11.5px;margin-top:10px">佳明需要账号密码，可能触发两步验证；其他品牌目前只记录账号。</div>
  `);

  $$('#bindBrands .chip').forEach(c => c.addEventListener('click', () => {
    $$('#bindBrands .chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
  }));

  $('#bindSubmit').addEventListener('click', async () => {
    const brand = $('#bindBrands .chip.active').dataset.brand;
    const account = $('#bindAccount').value.trim();
    const password = $('#bindPassword').value;
    if (!account) return toast('请填写账号');
    const btn = $('#bindSubmit');
    btn.disabled = true;
    btn.textContent = '绑定中…';
    try {
      const data = await api('/api/watch/bind', {
        method: 'POST',
        body: { brand, account, password, region: 'cn' },
      });
      if (data && data.needs_mfa) {
        $('#mfaBox').hidden = false;
        toast('需要两步验证码');
      } else {
        closeModal();
        toast('已绑定');
        state.meLoaded = false;
        loadMe();
        loadDashboard();
      }
    } catch (err) {
      toast('绑定失败：' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '绑定';
    }
  });

  $('#mfaSubmit').addEventListener('click', async () => {
    const code = $('#mfaCode').value.trim();
    if (!code) return toast('请输入验证码');
    try {
      await api('/api/watch/bind-mfa', { method: 'POST', body: { mfa_code: code } });
      closeModal();
      toast('绑定完成');
      state.meLoaded = false;
      loadMe();
      loadDashboard();
    } catch (err) {
      toast('验证失败：' + err.message);
    }
  });
}

async function toggleWatch(brand, enabled) {
  try {
    await api('/api/watch/toggle', { method: 'POST', body: { brand, enabled } });
    state.meLoaded = false;
    loadMe();
    loadDashboard();
  } catch (err) { toast('操作失败：' + err.message); }
}

async function selectWatch(brand) {
  try {
    await api('/api/watch/select', { method: 'POST', body: { brand } });
    toast('已切换');
    state.meLoaded = false;
    loadMe();
    loadDashboard();
  } catch (err) { toast('切换失败：' + err.message); }
}

async function unbindWatch(brand) {
  if (!confirm(`解绑 ${brandLabel(brand)}？`)) return;
  try {
    await api(`/api/watch/unbind?brand=${encodeURIComponent(brand)}`, { method: 'DELETE' });
    toast('已解绑');
    state.meLoaded = false;
    loadMe();
  } catch (err) { toast('解绑失败：' + err.message); }
}

/* ══════════════════════════════════════════════════════════════
   6.6 语音输入（按住说话，WAV 直传）
   ══════════════════════════════════════════════════════════════ */
let rec = null;

async function startRec() {
  if (rec) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return toast('当前浏览器不支持录音');
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC(16000);
    const source = ctx.createMediaStreamSource(stream);
    const proc = ctx.createScriptProcessor(4096, 1, 1);
    const chunks = [];
    proc.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    source.connect(proc);
    proc.connect(ctx.destination);
    rec = { ctx, stream, source, proc, chunks, t0: performance.now() };
    $('#micBtn').classList.add('recording');
    $('#recBanner').hidden = false;
    $('#recText').textContent = '正在录音… 松开发送';
  } catch (err) {
    toast('麦克风不可用（未授权或被占用）');
  }
}

function stopRec(send = true) {
  if (!rec) return;
  const { ctx, stream, source, proc, chunks, t0 } = rec;
  rec = null;
  try { proc.disconnect(); source.disconnect(); } catch {}
  stream.getTracks().forEach(t => t.stop());
  $('#micBtn').classList.remove('recording');
  $('#recBanner').hidden = true;
  const durMs = performance.now() - t0;
  const sampleRate = ctx.sampleRate;
  ctx.close();

  if (!send) return;
  if (durMs < 1000) return toast('说话时间太短，请按住说话');
  const samples = mergeFloat32(chunks);
  if (!samples.length) return toast('没录到声音');
  const wav = encodeWav(samples, sampleRate);
  sendVoice(new Blob([wav], { type: 'audio/wav' }), Math.max(1, Math.round(durMs / 1000)));
}

function mergeFloat32(chunks) {
  let len = 0;
  chunks.forEach(c => { len += c.length; });
  const out = new Float32Array(len);
  let off = 0;
  chunks.forEach(c => { out.set(c, off); off += c.length; });
  return out;
}

/** Float32 [-1,1] → 16bit PCM WAV */
function encodeWav(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + samples.length * 2, true);
  writeStr(8, 'WAVEfmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, samples.length * 2, true);
  let off = 44;
  for (let i = 0; i < samples.length; i++, off += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return buffer;
}

// 工具步骤展开/收起：事件委托，只注册一次
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.tool-toggle');
  if (!btn) return;
  const msg = state.chatMessages[Number(btn.dataset.idx)];
  if (!msg) return;
  msg.expanded = !msg.expanded;
  renderChat();
});

async function sendVoice(blob, durationSec) {
  if (state.chatBusy) return;
  const localUrl = URL.createObjectURL(blob);
  state.chatMessages.push({
    role: 'user', type: 'voice', audio_url: localUrl,
    duration_sec: durationSec, content: '', created_at: new Date().toISOString(),
  });
  state.chatBusy = true;
  renderChat();
  try {
    const form = new FormData();
    form.append('file', blob, 'voice.wav');
    form.append('duration_sec', String(durationSec));
    const data = await api('/api/chat/voice', { method: 'POST', body: form });
    const last = state.chatMessages[state.chatMessages.length - 1];
    if (data && data.audio_url) last.audio_url = data.audio_url;
    if (data && data.text) last.content = data.text;
    state.chatMessages.push({
      role: 'assistant', content: (data && data.reply) || '（没有回复）',
      created_at: new Date().toISOString(),
    });
    if (data && data.recorded) toast('已记录这次训练');
  } catch (err) {
    state.chatMessages.push({
      role: 'assistant', content: `⚠️ ${err.message}`, created_at: new Date().toISOString(),
    });
  } finally {
    state.chatBusy = false;
    renderChat();
  }
}

/* ══════════════════════════════════════════════════════════════
   6.7 刷新前先同步（和 Android 的刷新行为一致）
   ══════════════════════════════════════════════════════════════ */
function getPosition(timeout = 5000) {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    let done = false;
    const finish = pos => { if (!done) { done = true; resolve(pos); } };
    navigator.geolocation.getCurrentPosition(
      p => finish({ lat: p.coords.latitude, lon: p.coords.longitude }),
      () => finish(null),
      { timeout, maximumAge: 300000 }
    );
  });
}

async function syncAll() {
  const errors = [];
  try {
    await api('/api/health/sync', { method: 'POST' });
  } catch (err) {
    errors.push('手表同步失败：' + err.message);
  }
  try {
    const pos = await getPosition();
    if (pos) {
      await api(`/api/health/sync-weather?lon=${pos.lon}&lat=${pos.lat}`, { method: 'POST' });
    }
  } catch (err) {
    errors.push('天气同步失败：' + err.message);
  }
  if (errors.length) toast(errors[0], 3000);
  return errors.length === 0;
}

/* ══════════════════════════════════════════════════════════════
   7. 启动
   ══════════════════════════════════════════════════════════════ */
(async function boot() {
  if (!state.token) return;
  try {
    await api('/api/auth/me');
    enterApp();
  } catch {
    logout();
  }
})();
</script>

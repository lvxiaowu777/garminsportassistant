# Garmin Coach —— nginx 反代（SSE 必须关缓冲）
# 用法：改 server_name → 复制到 /etc/nginx/sites-available/garmin-coach
#       ln -s 到 sites-enabled → nginx -t && systemctl reload nginx

upstream garmin_coach_app {
    server 127.0.0.1:8766;
    keepalive 16;
}

server {
    listen 80;
    server_name your-domain.com;   # 没有域名就写 _

    client_max_body_size 25m;      # 语音上传

    # 首页不缓存，保证部署后能看到新页面
    location = / {
        proxy_pass http://garmin_coach_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }

    # 流式对话：关缓冲、关 gzip、长连接
    location = /api/chat/stream {
        proxy_pass http://garmin_coach_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-cache";
    }

    # 其余接口 / 静态资源
    location / {
        proxy_pass http://garmin_coach_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
